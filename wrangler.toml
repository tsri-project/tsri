name = "tsri-one-link-control-center"
compatibility_date = "2024-09-22"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "build/client"

# Cloudflare R2 Bucket Bindings
[[r2_buckets]]
binding = "DOCUMENTS_VAULT"
bucket_name = "tsri-documents-vault"

# Environment Variables (Non-sensitive)
[vars]
ENVIRONMENT = "production"
BUILD_TARGET = "production"
APP_NAME = "TSRI One Link for All Control Center"
APP_URL = "https://tsri-onelink.pages.dev"
SUPABASE_URL = "https://aatlledgsftkjfunqsvh.supabase.co"

[env.preview.vars]
ENVIRONMENT = "preview"
BUILD_TARGET = "preview"
APP_NAME = "TSRI One Link Control Center (Preview/Staging)"
APP_URL = "https://staging.tsri.pages.dev"
